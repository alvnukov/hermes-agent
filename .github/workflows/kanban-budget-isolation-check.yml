name: Isolated Kanban budget verification

on:
  push:
    branches: [codex/kanban-budget-isolation-check]
    paths: [.github/workflows/kanban-budget-isolation-check.yml, kanban-budget.patch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HERMES_HOME: ${{ runner.temp }}/kanban-verification-home
      HERMES_RUNTIME_DIR: ${{ runner.temp }}/kanban-verification-runtime
      HERMES_TEST_FILE_RETRIES: '0'
      HERMES_TEST_WORKERS: '2'
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pm
        with:
          extras: '[]'
          test-environment: 'true'
      - name: Baseline focused tests
        run: scripts/run_tests.sh tests/hermes_cli/test_kanban_worker_terminal_scope.py tests/hermes_cli/test_resolve_turn_limit.py tests/gateway/test_runtime_env_reload_config_authority.py
      - name: Export isolated test runtime for local verification
        if: always() && env.HERMES_PYTHON != ''
        shell: bash
        run: |
          set -euo pipefail
          "$HERMES_PYTHON" -c 'import sys,json; print(json.dumps({"prefix":sys.prefix,"base_prefix":sys.base_prefix,"executable":sys.executable}))' > "$RUNNER_TEMP/test-runtime.json"
          PREFIX=$("$HERMES_PYTHON" -c 'import sys; print(sys.prefix)')
          BASE=$("$HERMES_PYTHON" -c 'import sys; print(sys.base_prefix)')
          tar -czf "$RUNNER_TEMP/test-runtime.tar.gz" "$PREFIX" "$BASE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: isolated-kanban-test-runtime
          path: |
            ${{ runner.temp }}/test-runtime.tar.gz
            ${{ runner.temp }}/test-runtime.json
          retention-days: 1
          if-no-files-found: warn
